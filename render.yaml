services:
  - type: web
    name: todo-timed-api
    runtime: docker
    plan: free
    region: oregon
    rootDir: backend
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: ALLOWED_ORIGINS
        value: "*"

  - type: web
    name: todo-timed-web
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: |
      sed -i "s|__API_BASE_URL__|https://${API_BASE_HOST}|g" src/environments/environment.prod.ts && \
      npm ci && \
      npm run build -- --configuration=production
    staticPublishPath: dist/frontend/browser
    pullRequestPreviewsEnabled: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: API_BASE_HOST
        fromService:
          type: web
          name: todo-timed-api
          property: host
